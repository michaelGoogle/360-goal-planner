[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "goalplanner"
version = "0.1.0"
description = "360-Goal Planner (GP) — D2C BFF with in-process People Like You / needs; HU / SV upstreams"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.5.0",
    "requests>=2.31.0",
    "httpx>=0.27",
    "openai>=1.40",
    "anthropic>=0.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "httpx>=0.27",
    "ruff>=0.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "live: calls deployed FM / Claude (set GP_LIVE_PLU=1 or GP_LIVE_PARSE=1)",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"src" = ["prompts/*.md", "pipeline/prompts/*"]
